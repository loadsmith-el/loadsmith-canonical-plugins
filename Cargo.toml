# loadsmith-canonical-plugins — the official, supported plugin set for Loadsmith.
#
# A Cargo workspace with one member per plugin package (a "connector" when it
# provides more than one role). Each member declares its install metadata in
# `[package.metadata.loadsmith]`; CI builds it per-platform, publishes a GitHub
# Release, and emits the published `loadsmith-plugin.yaml` (with artifact URLs +
# checksums) into the index that `loadsmith plugin install` reads.
#
# The SDK crates come from the loadsmith repo as **git deps pinned by rev**
# (they stay 0.x, off crates.io). The four entries below must share one rev;
# to re-pin every plugin it is a single substitution:
#   sed -i 's/<old-rev>/<new-rev>/' Cargo.toml && cargo update -p loadsmith-plugin-sdk

[workspace]
resolver = "2"
members = [
    "file",
    "jsonl",
    "parquet",
    "null",
    "local-copy",
    "local-copy-chaos",
    "postgres",
    "mysql",
    "sharepoint",
    "oracle",
    "tabular",
    "csv",
    "excel",
    "s3",
]

[workspace.package]
license = "Apache-2.0"

[workspace.dependencies]
# Pinned Loadsmith SDK (one rev for all four; see the note at the top).
loadsmith-plugin-sdk = { git = "https://github.com/loadsmith-el/loadsmith", rev = "261870fa795f7c1f222869d75c91c4cc6b26e74b" }
loadsmith-arrow      = { git = "https://github.com/loadsmith-el/loadsmith", rev = "261870fa795f7c1f222869d75c91c4cc6b26e74b" }
loadsmith-tls        = { git = "https://github.com/loadsmith-el/loadsmith", rev = "261870fa795f7c1f222869d75c91c4cc6b26e74b" }
# The wire vocabulary (declared `columns:` of the tabular parsers).
loadsmith-protocol   = { git = "https://github.com/loadsmith-el/loadsmith", rev = "261870fa795f7c1f222869d75c91c4cc6b26e74b" }

# Common deps (versions mirror the loadsmith workspace).
tokio          = { version = "1", features = ["full"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
serde_yaml     = "0.9"
anyhow         = "1"
tracing        = "0.1"
async-trait    = "0.1"
arrow          = "54"
arrow-array    = "54"
arrow-schema   = "54"
tokio-postgres = "0.7"
postgres-types = { version = "0.2" }
# Global allocator for every plugin binary (see the #[global_allocator] in each bin).
mimalloc       = { version = "0.1", default-features = false }

# Release binaries ship as-is in archives and images: drop the symbol table
# (~25% smaller; panics still print their message, just without symbolized
# frames).
[profile.release]
strip = true
