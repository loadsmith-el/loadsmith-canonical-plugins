[package]
name    = "loadsmith-provider-file"
version = "0.2.0"
edition = "2021"
license.workspace = true

# Install metadata read by the loadsmith-canonical-plugins CI to emit the
# published `loadsmith-plugin.yaml`. `version` above is the single source of
# truth; the CI fills in per-platform artifact URLs + sha256 at release time.
[package.metadata.loadsmith]
name     = "file"
summary  = "File provider — resolves secret() values from local files (whole file or a JSON/YAML key)"
protocol = "^1"
provides = [
    { kind = "provider", bin = "loadsmith-provider-file" },
]

[[bin]]
name = "loadsmith-provider-file"
path = "src/main.rs"

[dependencies]
tokio                = { workspace = true }
anyhow               = { workspace = true }
serde                = { workspace = true }
serde_json           = { workspace = true }
serde_yaml           = { workspace = true }
async-trait          = { workspace = true }
loadsmith-plugin-sdk = { workspace = true }
mimalloc             = { workspace = true }
